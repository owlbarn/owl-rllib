name: Docker image

# Builds matrixanger/owl-rllib:latest on top of matrixanger/owl:main.
# Rebuilt on every push to main, by hand, when the Owl image changes (checked
# daily), or on a repository_dispatch of type owl-image-updated (which Owl's
# workflow can send after pushing its image).

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [owl-image-updated]
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: docker
  cancel-in-progress: false

env:
  BASE_IMAGE: matrixanger/owl:main
  IMAGE: matrixanger/owl-rllib:latest
  BASE_LABEL: org.owlbarn.owl-rllib.base-digest

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve the Owl image
        id: base
        run: |
          digest=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          built=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' 2>/dev/null \
                  | jq -r --arg l "$BASE_LABEL" '.config.Labels[$l] // empty' || true)
          echo "Owl image: $digest; owl-rllib:latest was built on: ${built:-nothing}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = schedule ] && [ "$digest" = "$built" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.base.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, test and push
        if: steps.base.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: BASE=matrixanger/owl@${{ steps.base.outputs.digest }}
          labels: ${{ env.BASE_LABEL }}=${{ steps.base.outputs.digest }}
          push: true
          tags: ${{ env.IMAGE }}
